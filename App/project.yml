name: Crepuscule
options:
  bundleIdPrefix: ch.cclerc
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: P69N7G8867
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  Crepuscule:
    path: ..
targets:
  CrepusculeApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: Crepuscule
        product: Crepuscule
      - target: CrepusculeWidgets
      - target: CrepusculeLockedCapture
    info:
      path: Info/App.plist
      properties:
        NSUserActivityTypes: [NSUserActivityTypeLockedCameraCapture]
    settings:
      base:
        PRODUCT_NAME: Crepuscule
        PRODUCT_MODULE_NAME: CrepusculeApp
        PRODUCT_BUNDLE_IDENTIFIER: ch.cclerc.crepuscule
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) CREPUSCULE_APP
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Crepuscule
        INFOPLIST_KEY_NSCameraUsageDescription: Crepuscule shoots RAW photos with the camera.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Crepuscule saves your finished photos to Photos.
        INFOPLIST_KEY_NSMotionUsageDescription: Crepuscule waits for the phone to settle before timed and bracketed shots.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: NO
  CrepusculeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetExtension
      - path: Shared
    info:
      path: Info/Widgets.plist
      properties:
        CFBundleDisplayName: Crepuscule
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.cclerc.crepuscule.widgets
        GENERATE_INFOPLIST_FILE: YES
  CrepusculeLockedCapture:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: LockedCapture
      - path: Shared
      # the app's camera, shared so the lock screen gets the same viewfinder and controls
      - path: Sources/CameraStore.swift
      - path: Sources/CameraModel.swift
      - path: Sources/CameraView.swift
      - path: Sources/CameraControls.swift
      - path: Sources/ManualControls.swift
      - path: Sources/Theme.swift
      - path: Sources/Viewfinder.swift
      - path: Sources/RenderEngine.swift
      - path: Sources/SystemCodeAction.swift
      - path: Sources/DemoCamera.swift
      - path: Resources/PrintLUT.cube
        buildPhase: resources
    dependencies:
      - package: Crepuscule
        product: Crepuscule
    info:
      path: Info/LockedCapture.plist
      properties:
        CFBundleDisplayName: Crepuscule
        NSCameraUsageDescription: Crepuscule shoots RAW photos with the camera.
        NSMotionUsageDescription: Crepuscule waits for the phone to settle before timed and bracketed shots.
        UIUserInterfaceStyle: Dark
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.securecapture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.cclerc.crepuscule.lockedcapture
        GENERATE_INFOPLIST_FILE: YES
